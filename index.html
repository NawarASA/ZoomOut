<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zoom Out</title>
  <meta name="description" content="A new photo every day, starting extremely zoomed in. Guess the object before it zooms all the way out.">
  <meta property="og:title" content="Zoom Out">
  <meta property="og:description" content="A new photo every day, starting extremely zoomed in. How fast can you guess it?">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#090C11">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <!-- Analytics: once you have a domain, sign up at plausible.io (or self-host Umami) and uncomment:
  <script defer data-domain="yourdomain.com" src="https://plausible.io/js/script.js"></script>
  -->
</head>
<body>
<div class="bokeh-box" aria-hidden="true"><canvas id="bokeh"></canvas></div>

<div class="wrap">
  <header>
    <h1 class="mark" aria-label="Zoom Out" id="mark"></h1>
    <div class="meta" id="meta">&nbsp;</div>
  </header>

  <div class="error" id="error" hidden></div>

  <main id="play" style="display:grid;gap:18px">
    <p class="note" id="banner" hidden><b>Today's photo isn't up yet.</b> Here's the most recent one.</p>

    <div class="lens" id="lens">
      <div class="glow"></div>
      <div class="glow-near"></div>
      <svg class="ring" viewBox="-10 -10 520 520" aria-hidden="true">
        <defs>
          <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3A4254"/><stop offset=".45" stop-color="#161B25"/><stop offset=".7" stop-color="#2A3242"/><stop offset="1" stop-color="#0E1219"/>
          </linearGradient>
        </defs>
        <circle cx="250" cy="250" r="224" fill="none" stroke="url(#metal)" stroke-width="48"/>
        <circle cx="250" cy="250" r="248" fill="none" stroke="#2C3446" stroke-width="1"/>
        <circle cx="250" cy="250" r="201" fill="none" stroke="#3A4356" stroke-width="2"/>
        <path class="index" d="M243 -9 L257 -9 L250 2 Z"/>
      </svg>
      <svg class="dial" id="dial" viewBox="-10 -10 520 520" aria-hidden="true"></svg>
      <div class="viewport">
        <canvas id="photo" role="img" aria-label="Zoomed-in photo of today's mystery object"></canvas>
        <div class="cross"></div>
        <div class="flash" id="flash"></div>
        <div class="mag" id="mag">16×</div>
      </div>
    </div>

    <p class="rules" id="rules">Guess the object. Every wrong guess zooms out. You have <b>six zooms</b>.</p>

    <form class="guess" id="guess-form" autocomplete="off">
      <input id="guess-input" type="text" placeholder="What are you looking at?" aria-label="Your guess" maxlength="40" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
      <button class="btn" type="submit" id="guess-btn">Guess</button>
      <button class="btn ghost" type="button" id="skip-btn">Zoom out</button>
    </form>
    <p class="msg" id="msg" aria-live="polite"></p>
    <ul class="guesses" id="guesses"></ul>

    <div class="end" id="end" hidden>
      <div class="kicker" id="end-kicker"></div>
      <h2 id="end-title"></h2>
      <p class="verdict" id="end-verdict"></p>
      <p class="verdict" id="credit" hidden></p>
      <div class="trail" id="trail"></div>
      <div class="row">
        <button class="btn" id="copy-btn" type="button">Copy result</button>
        <span class="countdown" id="countdown"></span>
      </div>
      <pre class="share" id="share"></pre>
      <div class="stats" id="stats"></div>
    </div>

    <section class="archive" id="archive" hidden>
      <h3>Past photos</h3>
      <div class="list" id="archive-list"></div>
    </section>
  </main>

  <footer>A new photo every day at midnight</footer>
</div>

<script type="module" src="js/game.js"></script>
</body>
</html>
